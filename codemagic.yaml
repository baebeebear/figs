workflows:
  ios-TestFlight-workflow:
    name: Figs iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    integrations:
      app_store_connect: "Codemagic Key"

environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.figsapp.figs
      vars:
        BUNDLE_ID: "com.figsapp.figs"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install web dependencies
        script: |
          npm install
      - name: Build web app (Next.js static export)
        script: |
          npm run build
      - name: Sync Capacitor iOS container
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Build iOS App for TestFlight
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - testers
