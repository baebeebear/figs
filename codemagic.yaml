workflows:
  ios-TestFlight-workflow:
    name: Figs iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    integrations:
      app_store_connect: "Codemagic Key"

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.figsapp.figs
      vars:
        BUNDLE_ID: "com.figsapp.figs"
        XCODE_WORKSPACE: "ios/App/App.xcworkspace"
        XCODE_SCHEME: "App"

        NEXT_PUBLIC_SUPABASE_URL: "https://xcvqfsqrnwljlohugsdm.supabase.co"
        NEXT_PUBLIC_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjdnFmc3FybndsamxvaHVnc2RtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTU1MDksImV4cCI6MjA5MzU5MTUwOX0.y0tVSzTZLRgFUZQWLKLU1o6BgLzza2OpJ6dYSx_Ih3c"
        VITE_SUPABASE_URL: "https://xcvqfsqrnwljlohugsdm.supabase.co"
        VITE_SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhjdnFmc3FybndsamxvaHVnc2RtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzgwMTU1MDksImV4cCI6MjA5MzU5MTUwOX0.y0tVSzTZLRgFUZQWLKLU1o6BgLzza2OpJ6dYSx_Ih3c"
        
        VITE_GOOGLE_WEB_CLIENT_ID: "327999147197-0ub120p3a2galvma9etnc2iurga3fl8d.apps.googleusercontent.com"
        NEXT_PUBLIC_GOOGLE_WEB_CLIENT_ID: "327999147197-0ub120p3a2galvma9etnc2iurga3fl8d.apps.googleusercontent.com"
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install web dependencies
        script: |
          npm install
      - name: Build web app (Next.js static export)
        script: |
          npm run build
      - name: Sync Capacitor iOS container
        script: |
          npx cap sync ios
      - name: Install CocoaPods dependencies
        script: |
          cd ios/App && pod install
      - name: Increment build number
        script: |
          cd ios/App
          agvtool new-version -all $(($BUILD_NUMBER + 1))
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles
      - name: Build iOS App for TestFlight
        script: |
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true