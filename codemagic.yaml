workflows:
  ios-TestFlight-workflow:
    name: Figs iOS TestFlight Release
    max_build_duration: 60
    instance_type: mac_mini_m2

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
          source: true

    # Connect your App Store Connect API key in Codemagic UI
    # (Team settings → Integrations → Developer Portal) and use its name here.
    integrations:
      app_store_connect: Codemagic

    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.figsapp.figs
      vars:
        BUNDLE_ID: com.figsapp.figs
        # Capacitor 8 SPM project — no CocoaPods .xcworkspace is generated
        XCODE_PROJECT: ios/App/App.xcodeproj
        XCODE_SCHEME: App
      node: 22
      xcode: latest
      cocoapods: default

    scripts:
      - name: Install web dependencies
        script: |
          npm install

      - name: Build web app
        script: |
          npm run build

      - name: Sync Capacitor iOS container
        script: |
          npx cap sync ios

      - name: Set up code signing settings
        script: |
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create
          xcode-project use-profiles

      - name: Increment build number
        script: |
          cd ios/App
          agvtool bump -all

      - name: Build iOS App for TestFlight
        script: |
          xcode-project build-ipa \
            --project "$XCODE_PROJECT" \
            --scheme "$XCODE_SCHEME"

    artifacts:
      - build/ios/ipa/*.ipa
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        beta_groups:
          - testers # Change this to match your App Store Connect TestFlight group name
